<!--
  Character: 통신도제 (integration-tongsin)
  Version: 1.0 / Phase 2 F
  Author: devDogam pixel team
  License: MIT (devDogam project internal)
  Based on: planner-dojeon.svg template (32x32 rect-based pixel art)
  Palette: base #0891B2, shadow #0E7490, skin #F0CFA0, outline #1A1410
  Hat: 패랭이 (기술계, 챙 표준 x=8~24)
  Expression: 차분형 (눈 1x1, 입 일자)
  Insignia: 레벨 1 (흉배 테두리만)
  Tools: 봉수 깃발(L) + 파발 끈(R)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="64" height="64">
  <!-- 패랭이 챙 (표준) -->
  <rect x="8"  y="5" width="16" height="2"  fill="#1A1410"/>
  <!-- 패랭이 몸통 -->
  <rect x="10" y="3" width="12" height="2"  fill="#1A1410"/>
  <!-- 패랭이 내부 -->
  <rect x="10" y="3" width="12" height="4"  fill="#063D52"/>
  <!-- 챙 끝 마무리 -->
  <rect x="8"  y="5" width="2"  height="2"  fill="#1A1410"/>
  <rect x="22" y="5" width="2"  height="2"  fill="#1A1410"/>
  <!-- 패랭이 하단 테두리 -->
  <rect x="9"  y="7" width="14" height="1"  fill="#1A1410"/>

  <!-- 얼굴 -->
  <rect x="10" y="9"  width="12" height="8" fill="#F0CFA0"/>
  <!-- 얼굴 좌 음영 -->
  <rect x="10" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 얼굴 우 음영 -->
  <rect x="21" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 차분형 눈 좌 (1x1) -->
  <rect x="13" y="12" width="1"  height="1" fill="#1A1410"/>
  <!-- 차분형 눈 우 (1x1) -->
  <rect x="18" y="12" width="1"  height="1" fill="#1A1410"/>
  <!-- 차분형 입 (3x1 일자) -->
  <rect x="14" y="15" width="4"  height="1" fill="#1A1410"/>

  <!-- 목 -->
  <rect x="13" y="17" width="6"  height="2" fill="#F0CFA0"/>
  <!-- 흰 깃 -->
  <rect x="11" y="18" width="2"  height="1" fill="#F4ECD8"/>
  <rect x="19" y="18" width="2"  height="1" fill="#F4ECD8"/>

  <!-- 관복 몸통 (청록) -->
  <rect x="9"  y="19" width="14" height="10" fill="#0891B2"/>
  <!-- 좌 어깨 음영 -->
  <rect x="9"  y="19" width="2"  height="10" fill="#0E7490"/>
  <!-- 우 어깨 음영 -->
  <rect x="21" y="19" width="2"  height="10" fill="#0E7490"/>
  <!-- 중앙 여밈선 -->
  <rect x="15" y="19" width="2"  height="10" fill="#0E7490"/>
  <!-- 소매 좌 -->
  <rect x="5"  y="20" width="4"  height="6"  fill="#0891B2"/>
  <!-- 소매 끝단 좌 -->
  <rect x="5"  y="25" width="4"  height="1"  fill="#0E7490"/>
  <!-- 소매 우 -->
  <rect x="23" y="20" width="4"  height="6"  fill="#0891B2"/>
  <!-- 소매 끝단 우 -->
  <rect x="23" y="25" width="4"  height="1"  fill="#0E7490"/>

  <!-- 흉배 레벨 1 — 테두리만 -->
  <rect x="14" y="22" width="4"  height="3"  fill="#0E7490"/>
  <rect x="15" y="23" width="2"  height="1"  fill="#0891B2"/>

  <!-- 도구 좌 소매: 봉수 깃발 (세로 막대 + 우 삼각 3x2px) -->
  <rect x="3"  y="21" width="1"  height="4"  fill="#1A1410"/>
  <rect x="4"  y="21" width="2"  height="1"  fill="#F4ECD8"/>
  <rect x="4"  y="22" width="1"  height="1"  fill="#F4ECD8"/>
  <!-- 도구 우 소매: 파발 끈 (가로 꼬인 2x1px) -->
  <rect x="27" y="24" width="2"  height="1"  fill="#F4ECD8"/>
  <rect x="28" y="23" width="2"  height="1"  fill="#F4ECD8"/>

  <!-- 발 / 신발 -->
  <rect x="10" y="29" width="4"  height="3"  fill="#1A1410"/>
  <rect x="18" y="29" width="4"  height="3"  fill="#1A1410"/>
</svg>
