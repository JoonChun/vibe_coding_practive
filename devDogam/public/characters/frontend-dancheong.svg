<!--
  Character: 단청도제 (frontend-dancheong)
  Version: 1.0 / Phase 2 F
  Author: devDogam pixel team
  License: MIT (devDogam project internal)
  Based on: planner-dojeon.svg template (32x32 rect-based pixel art)
  Palette: base #D97706, shadow #B45309, skin #F0CFA0, outline #1A1410
  Hat: 패랭이 (기술계, 챙 넓음 x=7~25)
  Expression: 들뜬형 (눈 위 하이라이트, 입 열림)
  Insignia: 레벨 1 (흉배 테두리만)
  Tools: 채색 붓(L) + 물감 단지(R)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="64" height="64">
  <!-- 패랭이 챙 (넓음, 관복 밖으로 삐져나감) -->
  <rect x="7"  y="5" width="18" height="2"  fill="#1A1410"/>
  <!-- 패랭이 몸통 -->
  <rect x="9"  y="3" width="14" height="2"  fill="#1A1410"/>
  <!-- 패랭이 하단 테두리 -->
  <rect x="8"  y="7" width="16" height="1"  fill="#1A1410"/>
  <!-- 패랭이 내부 (약간 밝은 채색) -->
  <rect x="9"  y="3" width="14" height="4"  fill="#5C3D0A"/>
  <!-- 챙 오버레이 -->
  <rect x="7"  y="5" width="2"  height="2"  fill="#1A1410"/>
  <rect x="23" y="5" width="2"  height="2"  fill="#1A1410"/>

  <!-- 얼굴 -->
  <rect x="10" y="9"  width="12" height="8" fill="#F0CFA0"/>
  <!-- 얼굴 좌 음영 -->
  <rect x="10" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 얼굴 우 음영 -->
  <rect x="21" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 들뜬형 눈 위 하이라이트 -->
  <rect x="12" y="11" width="1"  height="1" fill="#FFFFFF"/>
  <rect x="19" y="11" width="1"  height="1" fill="#FFFFFF"/>
  <!-- 눈 들뜬형 좌 (2x2) -->
  <rect x="12" y="12" width="2"  height="2" fill="#1A1410"/>
  <!-- 눈 들뜬형 우 (2x2) -->
  <rect x="18" y="12" width="2"  height="2" fill="#1A1410"/>
  <!-- 입 들뜬형 (열림 3x2, 암색) -->
  <rect x="13" y="14" width="6"  height="1" fill="#1A1410"/>
  <rect x="13" y="15" width="6"  height="1" fill="#C9A37A"/>

  <!-- 목 -->
  <rect x="13" y="17" width="6"  height="2" fill="#F0CFA0"/>
  <!-- 흰 깃 -->
  <rect x="11" y="18" width="2"  height="1" fill="#F4ECD8"/>
  <rect x="19" y="18" width="2"  height="1" fill="#F4ECD8"/>

  <!-- 관복 몸통 (주황) -->
  <rect x="9"  y="19" width="14" height="10" fill="#D97706"/>
  <!-- 좌 어깨 음영 -->
  <rect x="9"  y="19" width="2"  height="10" fill="#B45309"/>
  <!-- 우 어깨 음영 -->
  <rect x="21" y="19" width="2"  height="10" fill="#B45309"/>
  <!-- 중앙 여밈선 -->
  <rect x="15" y="19" width="2"  height="10" fill="#B45309"/>
  <!-- 소매 좌 -->
  <rect x="5"  y="20" width="4"  height="6"  fill="#D97706"/>
  <!-- 소매 끝단 좌 -->
  <rect x="5"  y="25" width="4"  height="1"  fill="#B45309"/>
  <!-- 소매 우 -->
  <rect x="23" y="20" width="4"  height="6"  fill="#D97706"/>
  <!-- 소매 끝단 우 -->
  <rect x="23" y="25" width="4"  height="1"  fill="#B45309"/>

  <!-- 흉배 레벨 1 — 테두리만 (2x2 빈 사각형) -->
  <rect x="14" y="22" width="4"  height="3"  fill="#B45309"/>
  <rect x="15" y="23" width="2"  height="1"  fill="#D97706"/>

  <!-- 도구 좌 소매: 채색 붓 (세로 1x4 + 끝 노랑 1px) -->
  <rect x="4"  y="21" width="1"  height="3"  fill="#F4ECD8"/>
  <rect x="4"  y="24" width="1"  height="1"  fill="#D97706"/>
  <rect x="4"  y="25" width="1"  height="1"  fill="#1A1410"/>
  <!-- 도구 우 소매: 물감 단지 (반원 3x2px) -->
  <rect x="27" y="23" width="3"  height="2"  fill="#F4ECD8"/>
  <rect x="27" y="23" width="3"  height="1"  fill="#1A1410"/>
  <rect x="27" y="25" width="3"  height="1"  fill="#1A1410"/>

  <!-- 발 / 신발 -->
  <rect x="10" y="29" width="4"  height="3"  fill="#1A1410"/>
  <rect x="18" y="29" width="4"  height="3"  fill="#1A1410"/>
</svg>
