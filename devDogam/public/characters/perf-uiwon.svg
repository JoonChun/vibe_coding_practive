<!--
  Character: 의원 (perf-uiwon)
  Version: 1.0 / Phase 2 F
  Author: devDogam pixel team
  License: MIT (devDogam project internal)
  Based on: planner-dojeon.svg template (32x32 rect-based pixel art)
  Palette: base #EC4899, shadow #BE185D, skin #F0CFA0, outline #1A1410
  Hat: 벙거지 (군계, 둥근 형태)
  Expression: 온화형 (눈 1x1 가늘게, 입 U자 미소)
  Insignia: 레벨 2 (흉배 내부 점) — 개념시트 §4.1 레벨2 포함
  Tools: 약사발(L) + 약병(R)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="64" height="64">
  <!-- 벙거지 (둥근, 낮음) -->
  <rect x="10" y="4" width="12" height="1"  fill="#1A1410"/>
  <!-- 벙거지 몸통 -->
  <rect x="9"  y="5" width="14" height="3"  fill="#1A1410"/>
  <!-- 벙거지 내부 -->
  <rect x="10" y="5" width="12" height="2"  fill="#5C1028"/>
  <!-- 벙거지 하단 테두리 -->
  <rect x="9"  y="7" width="14" height="1"  fill="#1A1410"/>

  <!-- 얼굴 -->
  <rect x="10" y="9"  width="12" height="8" fill="#F0CFA0"/>
  <!-- 얼굴 좌 음영 -->
  <rect x="10" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 얼굴 우 음영 -->
  <rect x="21" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 온화형 눈 좌 (1x1 가늘게) -->
  <rect x="13" y="12" width="1"  height="1" fill="#1A1410"/>
  <!-- 온화형 눈 우 (1x1 가늘게) -->
  <rect x="18" y="12" width="1"  height="1" fill="#1A1410"/>
  <!-- 온화형 입 U자 미소 -->
  <rect x="13" y="14" width="1"  height="1" fill="#1A1410"/>
  <rect x="19" y="14" width="1"  height="1" fill="#1A1410"/>
  <rect x="14" y="15" width="5"  height="1" fill="#1A1410"/>

  <!-- 목 -->
  <rect x="13" y="17" width="6"  height="2" fill="#F0CFA0"/>
  <!-- 흰 깃 -->
  <rect x="11" y="18" width="2"  height="1" fill="#F4ECD8"/>
  <rect x="19" y="18" width="2"  height="1" fill="#F4ECD8"/>

  <!-- 관복 몸통 (핑크) -->
  <rect x="9"  y="19" width="14" height="10" fill="#EC4899"/>
  <!-- 좌 어깨 음영 -->
  <rect x="9"  y="19" width="2"  height="10" fill="#BE185D"/>
  <!-- 우 어깨 음영 -->
  <rect x="21" y="19" width="2"  height="10" fill="#BE185D"/>
  <!-- 중앙 여밈선 -->
  <rect x="15" y="19" width="2"  height="10" fill="#BE185D"/>
  <!-- 소매 좌 -->
  <rect x="5"  y="20" width="4"  height="6"  fill="#EC4899"/>
  <!-- 소매 끝단 좌 -->
  <rect x="5"  y="25" width="4"  height="1"  fill="#BE185D"/>
  <!-- 소매 우 -->
  <rect x="23" y="20" width="4"  height="6"  fill="#EC4899"/>
  <!-- 소매 끝단 우 -->
  <rect x="23" y="25" width="4"  height="1"  fill="#BE185D"/>

  <!-- 흉배 레벨 2 — 테두리 + 내부 점 -->
  <rect x="13" y="21" width="6"  height="4"  fill="#BE185D"/>
  <rect x="15" y="22" width="2"  height="2"  fill="#F4ECD8"/>

  <!-- 도구 좌 소매: 약사발 (반원 3x2px, 내부 검정) -->
  <rect x="3"  y="23" width="3"  height="2"  fill="#F4ECD8"/>
  <rect x="3"  y="23" width="3"  height="1"  fill="#1A1410"/>
  <!-- 도구 우 소매: 약병 (원통 2x3px + 뚜껑 1px) -->
  <rect x="28" y="21" width="2"  height="3"  fill="#F4ECD8"/>
  <rect x="28" y="21" width="2"  height="1"  fill="#1A1410"/>
  <rect x="28" y="24" width="2"  height="1"  fill="#1A1410"/>

  <!-- 발 / 신발 -->
  <rect x="10" y="29" width="4"  height="3"  fill="#1A1410"/>
  <rect x="18" y="29" width="4"  height="3"  fill="#1A1410"/>
</svg>
