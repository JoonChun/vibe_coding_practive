<!--
  Character: 화공 (visual-hwagong)
  Version: 1.0 / Phase 2 F
  Author: devDogam pixel team
  License: MIT (devDogam project internal)
  Based on: planner-dojeon.svg template (32x32 rect-based pixel art)
  Palette: base #15803D, shadow #166534, skin #F0CFA0, outline #1A1410
  Hat: 정자관 (학자계, 망건 띠 + 격자 관)
  Expression: 들뜬형 (눈 위 하이라이트, 입 열림)
  Insignia: 레벨 2 (흉배 내부 점)
  Tools: 화필(L) + 종이(R)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="64" height="64">
  <!-- 정자관 — 망건 띠 -->
  <rect x="9"  y="8" width="14" height="1"  fill="#1A1410"/>
  <!-- 정자관 몸체 하단 -->
  <rect x="10" y="6" width="12" height="2"  fill="#1A1410"/>
  <!-- 정자관 격자 내부 -->
  <rect x="10" y="4" width="12" height="2"  fill="#1A1A1A"/>
  <!-- 격자 세로선 1 -->
  <rect x="12" y="4" width="1"  height="2"  fill="#1A1410"/>
  <!-- 격자 세로선 2 -->
  <rect x="15" y="4" width="1"  height="2"  fill="#1A1410"/>
  <!-- 격자 세로선 3 -->
  <rect x="18" y="4" width="1"  height="2"  fill="#1A1410"/>
  <!-- 격자 세로선 4 -->
  <rect x="21" y="4" width="1"  height="2"  fill="#1A1410"/>
  <!-- 정자관 상단 테두리 -->
  <rect x="10" y="3" width="12" height="1"  fill="#1A1410"/>

  <!-- 얼굴 -->
  <rect x="10" y="9"  width="12" height="8" fill="#F0CFA0"/>
  <!-- 얼굴 좌 음영 -->
  <rect x="10" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 얼굴 우 음영 -->
  <rect x="21" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 들뜬형 눈 위 하이라이트 -->
  <rect x="12" y="11" width="1"  height="1" fill="#FFFFFF"/>
  <rect x="19" y="11" width="1"  height="1" fill="#FFFFFF"/>
  <!-- 눈 들뜬형 좌 (2x2) -->
  <rect x="12" y="12" width="2"  height="2" fill="#1A1410"/>
  <!-- 눈 들뜬형 우 (2x2) -->
  <rect x="18" y="12" width="2"  height="2" fill="#1A1410"/>
  <!-- 입 들뜬형 (열림 3x2, 암색) -->
  <rect x="13" y="14" width="6"  height="1" fill="#1A1410"/>
  <rect x="13" y="15" width="6"  height="1" fill="#C9A37A"/>

  <!-- 목 -->
  <rect x="13" y="17" width="6"  height="2" fill="#F0CFA0"/>
  <!-- 흰 깃 -->
  <rect x="11" y="18" width="2"  height="1" fill="#F4ECD8"/>
  <rect x="19" y="18" width="2"  height="1" fill="#F4ECD8"/>

  <!-- 관복 몸통 (짙은 초록) -->
  <rect x="9"  y="19" width="14" height="10" fill="#15803D"/>
  <!-- 좌 어깨 음영 -->
  <rect x="9"  y="19" width="2"  height="10" fill="#166534"/>
  <!-- 우 어깨 음영 -->
  <rect x="21" y="19" width="2"  height="10" fill="#166534"/>
  <!-- 중앙 여밈선 -->
  <rect x="15" y="19" width="2"  height="10" fill="#166534"/>
  <!-- 소매 좌 -->
  <rect x="5"  y="20" width="4"  height="6"  fill="#15803D"/>
  <!-- 소매 끝단 좌 -->
  <rect x="5"  y="25" width="4"  height="1"  fill="#166534"/>
  <!-- 소매 우 -->
  <rect x="23" y="20" width="4"  height="6"  fill="#15803D"/>
  <!-- 소매 끝단 우 -->
  <rect x="23" y="25" width="4"  height="1"  fill="#166534"/>

  <!-- 흉배 레벨 2 — 테두리 + 내부 점 -->
  <rect x="13" y="21" width="6"  height="4"  fill="#166534"/>
  <rect x="15" y="22" width="2"  height="2"  fill="#F4ECD8"/>

  <!-- 도구 좌 소매: 화필 (붓 + 끝 색상) -->
  <rect x="4"  y="20" width="1"  height="4"  fill="#F4ECD8"/>
  <rect x="4"  y="24" width="1"  height="1"  fill="#15803D"/>
  <rect x="4"  y="25" width="1"  height="1"  fill="#1A1410"/>
  <!-- 도구 우 소매: 종이 (흰 사각형 2x3px + 테두리) -->
  <rect x="28" y="21" width="2"  height="3"  fill="#F4ECD8"/>
  <rect x="28" y="21" width="2"  height="1"  fill="#1A1410"/>
  <rect x="28" y="23" width="2"  height="1"  fill="#1A1410"/>
  <rect x="28" y="21" width="1"  height="3"  fill="#1A1410"/>

  <!-- 발 / 신발 -->
  <rect x="10" y="29" width="4"  height="3"  fill="#1A1410"/>
  <rect x="18" y="29" width="4"  height="3"  fill="#1A1410"/>
</svg>
