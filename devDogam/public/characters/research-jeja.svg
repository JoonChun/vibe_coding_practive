<!--
  Character: 제자 (research-jeja)
  Version: 1.0 / Phase 2 F
  Author: devDogam pixel team
  License: MIT (devDogam project internal)
  Based on: planner-dojeon.svg template (32x32 rect-based pixel art)
  Palette: base #16A34A, shadow #15803D, skin #F0CFA0, outline #1A1410
  Hat: 정자관 (학자계, 망건 띠 + 격자 관)
  Expression: 온화형 (눈 1x1 가늘게, 입 U자 미소)
  Insignia: 레벨 2 (흉배 내부 점)
  Tools: 책(L) + 두루마리(R)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="64" height="64">
  <!-- 정자관 — 망건 띠 (y=8, 검정 수평선) -->
  <rect x="9"  y="8" width="14" height="1"  fill="#1A1410"/>
  <!-- 정자관 몸체 하단 -->
  <rect x="10" y="6" width="12" height="2"  fill="#1A1410"/>
  <!-- 정자관 격자 내부 (y=4~5, 격자 패턴) -->
  <rect x="10" y="4" width="12" height="2"  fill="#1A1A1A"/>
  <!-- 격자 세로선 1 -->
  <rect x="12" y="4" width="1"  height="2"  fill="#1A1410"/>
  <!-- 격자 세로선 2 -->
  <rect x="15" y="4" width="1"  height="2"  fill="#1A1410"/>
  <!-- 격자 세로선 3 -->
  <rect x="18" y="4" width="1"  height="2"  fill="#1A1410"/>
  <!-- 격자 세로선 4 -->
  <rect x="21" y="4" width="1"  height="2"  fill="#1A1410"/>
  <!-- 정자관 상단 테두리 -->
  <rect x="10" y="3" width="12" height="1"  fill="#1A1410"/>

  <!-- 얼굴 -->
  <rect x="10" y="9"  width="12" height="8" fill="#F0CFA0"/>
  <!-- 얼굴 좌 음영 -->
  <rect x="10" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 얼굴 우 음영 -->
  <rect x="21" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 온화형 눈 좌 (1x1 가늘게) -->
  <rect x="13" y="12" width="1"  height="1" fill="#1A1410"/>
  <!-- 온화형 눈 우 (1x1 가늘게) -->
  <rect x="18" y="12" width="1"  height="1" fill="#1A1410"/>
  <!-- 온화형 입 U자 미소 -->
  <rect x="13" y="14" width="1"  height="1" fill="#1A1410"/>
  <rect x="19" y="14" width="1"  height="1" fill="#1A1410"/>
  <rect x="14" y="15" width="5"  height="1" fill="#1A1410"/>

  <!-- 목 -->
  <rect x="13" y="17" width="6"  height="2" fill="#F0CFA0"/>
  <!-- 흰 깃 -->
  <rect x="11" y="18" width="2"  height="1" fill="#F4ECD8"/>
  <rect x="19" y="18" width="2"  height="1" fill="#F4ECD8"/>

  <!-- 관복 몸통 (초록) -->
  <rect x="9"  y="19" width="14" height="10" fill="#16A34A"/>
  <!-- 좌 어깨 음영 -->
  <rect x="9"  y="19" width="2"  height="10" fill="#15803D"/>
  <!-- 우 어깨 음영 -->
  <rect x="21" y="19" width="2"  height="10" fill="#15803D"/>
  <!-- 중앙 여밈선 -->
  <rect x="15" y="19" width="2"  height="10" fill="#15803D"/>
  <!-- 소매 좌 -->
  <rect x="5"  y="20" width="4"  height="6"  fill="#16A34A"/>
  <!-- 소매 끝단 좌 -->
  <rect x="5"  y="25" width="4"  height="1"  fill="#15803D"/>
  <!-- 소매 우 -->
  <rect x="23" y="20" width="4"  height="6"  fill="#16A34A"/>
  <!-- 소매 끝단 우 -->
  <rect x="23" y="25" width="4"  height="1"  fill="#15803D"/>

  <!-- 흉배 레벨 2 — 테두리 + 내부 점 -->
  <rect x="13" y="21" width="6"  height="4"  fill="#15803D"/>
  <rect x="15" y="22" width="2"  height="2"  fill="#F4ECD8"/>

  <!-- 도구 좌 소매: 책 (3x4px + 좌 세로선) -->
  <rect x="2"  y="21" width="3"  height="4"  fill="#F4ECD8"/>
  <rect x="2"  y="21" width="1"  height="4"  fill="#1A1410"/>
  <rect x="2"  y="21" width="3"  height="1"  fill="#1A1410"/>
  <rect x="2"  y="24" width="3"  height="1"  fill="#1A1410"/>
  <!-- 도구 우 소매: 두루마리 (가로 4px 원통) -->
  <rect x="27" y="23" width="4"  height="1"  fill="#1A1410"/>
  <rect x="27" y="24" width="4"  height="1"  fill="#F4ECD8"/>
  <rect x="27" y="25" width="4"  height="1"  fill="#1A1410"/>

  <!-- 발 / 신발 -->
  <rect x="10" y="29" width="4"  height="3"  fill="#1A1410"/>
  <rect x="18" y="29" width="4"  height="3"  fill="#1A1410"/>
</svg>
