<!--
  Character: 도화서 화원 (uiux-hwawon)
  Version: 1.0 / Phase 2 F
  Author: devDogam pixel team
  License: MIT (devDogam project internal)
  Based on: planner-dojeon.svg template (32x32 rect-based pixel art)
  Palette: base #7C3AED, shadow #5B21B6, skin #F0CFA0, outline #1A1410
  Hat: 복두 (문관계, 좌우 각 2px 축소)
  Expression: 들뜬형 (눈 위 하이라이트, 입 열림)
  Insignia: 레벨 2 (흉배 내부 점)
  Tools: 팔레트(L) + 그림붓(R)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="64" height="64">
  <!-- 복두 기단 (각 더 축소) -->
  <rect x="10" y="4" width="12" height="2" fill="#1A1410"/>
  <!-- 복두 좌 각 (짧은 1px) -->
  <rect x="9"  y="3" width="1"  height="2" fill="#1A1410"/>
  <!-- 복두 우 각 (짧은 1px) -->
  <rect x="22" y="3" width="1"  height="2" fill="#1A1410"/>
  <!-- 복두 몸체 -->
  <rect x="10" y="6" width="12" height="2" fill="#1A1410"/>
  <!-- 복두 하단 테두리 -->
  <rect x="9"  y="8" width="14" height="1" fill="#1A1410"/>

  <!-- 얼굴 -->
  <rect x="10" y="9"  width="12" height="8" fill="#F0CFA0"/>
  <!-- 얼굴 좌 음영 -->
  <rect x="10" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 얼굴 우 음영 -->
  <rect x="21" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 들뜬형 — 눈 위 하이라이트 (1px 흰 점) -->
  <rect x="12" y="11" width="1"  height="1" fill="#FFFFFF"/>
  <rect x="19" y="11" width="1"  height="1" fill="#FFFFFF"/>
  <!-- 눈 들뜬형 좌 (2x2) -->
  <rect x="12" y="12" width="2"  height="2" fill="#1A1410"/>
  <!-- 눈 들뜬형 우 (2x2) -->
  <rect x="18" y="12" width="2"  height="2" fill="#1A1410"/>
  <!-- 입 들뜬형 (3x2 열린 모양, 암색) -->
  <rect x="13" y="14" width="6"  height="1" fill="#1A1410"/>
  <rect x="13" y="15" width="6"  height="1" fill="#C9A37A"/>

  <!-- 목 -->
  <rect x="13" y="17" width="6"  height="2" fill="#F0CFA0"/>
  <!-- 흰 깃 -->
  <rect x="11" y="18" width="2"  height="1" fill="#F4ECD8"/>
  <rect x="19" y="18" width="2"  height="1" fill="#F4ECD8"/>

  <!-- 관복 몸통 (보라) -->
  <rect x="9"  y="19" width="14" height="10" fill="#7C3AED"/>
  <!-- 좌 어깨 음영 -->
  <rect x="9"  y="19" width="2"  height="10" fill="#5B21B6"/>
  <!-- 우 어깨 음영 -->
  <rect x="21" y="19" width="2"  height="10" fill="#5B21B6"/>
  <!-- 중앙 여밈선 -->
  <rect x="15" y="19" width="2"  height="10" fill="#5B21B6"/>
  <!-- 소매 좌 -->
  <rect x="5"  y="20" width="4"  height="6"  fill="#7C3AED"/>
  <!-- 소매 끝단 좌 -->
  <rect x="5"  y="25" width="4"  height="1"  fill="#5B21B6"/>
  <!-- 소매 우 -->
  <rect x="23" y="20" width="4"  height="6"  fill="#7C3AED"/>
  <!-- 소매 끝단 우 -->
  <rect x="23" y="25" width="4"  height="1"  fill="#5B21B6"/>

  <!-- 흉배 레벨 2 — 테두리 + 내부 점 -->
  <rect x="13" y="21" width="6"  height="4"  fill="#5B21B6"/>
  <rect x="15" y="22" width="2"  height="2"  fill="#F4ECD8"/>

  <!-- 도구 좌 소매: 팔레트 (4x3px + 컬러 점 3개) -->
  <rect x="2"  y="22" width="4"  height="3"  fill="#F4ECD8"/>
  <rect x="2"  y="22" width="1"  height="1"  fill="#DC2626"/>
  <rect x="4"  y="22" width="1"  height="1"  fill="#06B6D4"/>
  <rect x="3"  y="24" width="1"  height="1"  fill="#D97706"/>
  <!-- 도구 우 소매: 그림 붓 (세로 1x4 + 색 끝) -->
  <rect x="28" y="21" width="1"  height="3"  fill="#F4ECD8"/>
  <rect x="28" y="24" width="1"  height="1"  fill="#7C3AED"/>
  <rect x="28" y="25" width="1"  height="1"  fill="#1A1410"/>

  <!-- 발 / 신발 -->
  <rect x="10" y="29" width="4"  height="3"  fill="#1A1410"/>
  <rect x="18" y="29" width="4"  height="3"  fill="#1A1410"/>
</svg>
