<!--
  Character: 군관 (test-gungwan)
  Version: 1.0 / Phase 2 F
  Author: devDogam pixel team
  License: MIT (devDogam project internal)
  Based on: planner-dojeon.svg template (32x32 rect-based pixel art)
  Palette: base #B91C1C, shadow #7F1D1D, skin #F0CFA0, outline #1A1410
  Hat: 전립 (군계, 둥근 형태, 약간 챙)
  Expression: 긴장형 (눈 3x2 넓게, 입 좁게)
  Insignia: 레벨 0 (흉배 없음)
  Tools: 창(L) + 깃발(R)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="64" height="64">
  <!-- 전립 (약간 챙, 군관) -->
  <rect x="9"  y="5" width="14" height="1"  fill="#1A1410"/>
  <!-- 전립 몸통 -->
  <rect x="10" y="4" width="12" height="3"  fill="#1A1410"/>
  <!-- 전립 내부 -->
  <rect x="10" y="4" width="12" height="2"  fill="#2D0A0A"/>
  <!-- 전립 하단 테두리 -->
  <rect x="9"  y="7" width="14" height="1"  fill="#1A1410"/>

  <!-- 얼굴 -->
  <rect x="10" y="9"  width="12" height="8" fill="#F0CFA0"/>
  <!-- 얼굴 좌 음영 -->
  <rect x="10" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 얼굴 우 음영 -->
  <rect x="21" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 긴장형 눈 좌 (3x2 넓게) -->
  <rect x="11" y="11" width="3"  height="2" fill="#1A1410"/>
  <!-- 긴장형 눈 우 (3x2 넓게) -->
  <rect x="18" y="11" width="3"  height="2" fill="#1A1410"/>
  <!-- 긴장형 입 (좁게 2x1) -->
  <rect x="14" y="15" width="4"  height="1" fill="#1A1410"/>

  <!-- 목 -->
  <rect x="13" y="17" width="6"  height="2" fill="#F0CFA0"/>
  <!-- 흰 깃 -->
  <rect x="11" y="18" width="2"  height="1" fill="#F4ECD8"/>
  <rect x="19" y="18" width="2"  height="1" fill="#F4ECD8"/>

  <!-- 관복 몸통 (짙은 빨강) -->
  <rect x="9"  y="19" width="14" height="10" fill="#B91C1C"/>
  <!-- 좌 어깨 음영 -->
  <rect x="9"  y="19" width="2"  height="10" fill="#7F1D1D"/>
  <!-- 우 어깨 음영 -->
  <rect x="21" y="19" width="2"  height="10" fill="#7F1D1D"/>
  <!-- 중앙 여밈선 (레벨0) -->
  <rect x="15" y="19" width="2"  height="10" fill="#7F1D1D"/>
  <!-- 소매 좌 -->
  <rect x="5"  y="20" width="4"  height="6"  fill="#B91C1C"/>
  <!-- 소매 끝단 좌 -->
  <rect x="5"  y="25" width="4"  height="1"  fill="#7F1D1D"/>
  <!-- 소매 우 -->
  <rect x="23" y="20" width="4"  height="6"  fill="#B91C1C"/>
  <!-- 소매 끝단 우 -->
  <rect x="23" y="25" width="4"  height="1"  fill="#7F1D1D"/>

  <!-- 흉배 레벨 0 — 없음 -->

  <!-- 도구 좌 소매: 창 (세로 5px + 상단 뾰족 2px) -->
  <rect x="4"  y="19" width="1"  height="5"  fill="#C9A37A"/>
  <rect x="3"  y="19" width="1"  height="2"  fill="#1A1410"/>
  <rect x="5"  y="19" width="1"  height="2"  fill="#1A1410"/>
  <!-- 도구 우 소매: 깃발 (세로 막대 + 좌 삼각 2x2px) -->
  <rect x="29" y="20" width="1"  height="4"  fill="#1A1410"/>
  <rect x="27" y="20" width="2"  height="1"  fill="#F4ECD8"/>
  <rect x="27" y="21" width="1"  height="1"  fill="#F4ECD8"/>

  <!-- 발 / 신발 -->
  <rect x="10" y="29" width="4"  height="3"  fill="#1A1410"/>
  <rect x="18" y="29" width="4"  height="3"  fill="#1A1410"/>
</svg>
