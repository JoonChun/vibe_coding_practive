<!--
  Character: 토목도제 (infra-tomok)
  Version: 1.0 / Phase 2 F
  Author: devDogam pixel team
  License: MIT (devDogam project internal)
  Based on: planner-dojeon.svg template (32x32 rect-based pixel art)
  Palette: base #DB2777, shadow #9D174D, skin #F0CFA0, outline #1A1410
  Hat: 패랭이 (기술계, 챙 넓음 x=7~25)
  Expression: 차분형 (눈 1x1 작은 점, 입 일자)
  Insignia: 레벨 1 (흉배 테두리만)
  Tools: 삽(L) + 돌덩이(R)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="64" height="64">
  <!-- 패랭이 챙 (넓음) -->
  <rect x="7"  y="5" width="18" height="2"  fill="#1A1410"/>
  <!-- 패랭이 몸통 -->
  <rect x="9"  y="3" width="14" height="2"  fill="#1A1410"/>
  <!-- 패랭이 내부 -->
  <rect x="9"  y="3" width="14" height="4"  fill="#5C1A2E"/>
  <!-- 챙 양끝 마무리 -->
  <rect x="7"  y="5" width="2"  height="2"  fill="#1A1410"/>
  <rect x="23" y="5" width="2"  height="2"  fill="#1A1410"/>
  <!-- 패랭이 하단 테두리 -->
  <rect x="8"  y="7" width="16" height="1"  fill="#1A1410"/>

  <!-- 얼굴 -->
  <rect x="10" y="9"  width="12" height="8" fill="#F0CFA0"/>
  <!-- 얼굴 좌 음영 -->
  <rect x="10" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 얼굴 우 음영 -->
  <rect x="21" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 차분형 눈 좌 (1x1 작은 점) -->
  <rect x="13" y="12" width="1"  height="1" fill="#1A1410"/>
  <!-- 차분형 눈 우 (1x1 작은 점) -->
  <rect x="18" y="12" width="1"  height="1" fill="#1A1410"/>
  <!-- 차분형 입 (3x1 일자) -->
  <rect x="14" y="15" width="4"  height="1" fill="#1A1410"/>

  <!-- 목 -->
  <rect x="13" y="17" width="6"  height="2" fill="#F0CFA0"/>
  <!-- 흰 깃 -->
  <rect x="11" y="18" width="2"  height="1" fill="#F4ECD8"/>
  <rect x="19" y="18" width="2"  height="1" fill="#F4ECD8"/>

  <!-- 관복 몸통 (분홍) -->
  <rect x="9"  y="19" width="14" height="10" fill="#DB2777"/>
  <!-- 좌 어깨 음영 -->
  <rect x="9"  y="19" width="2"  height="10" fill="#9D174D"/>
  <!-- 우 어깨 음영 -->
  <rect x="21" y="19" width="2"  height="10" fill="#9D174D"/>
  <!-- 중앙 여밈선 -->
  <rect x="15" y="19" width="2"  height="10" fill="#9D174D"/>
  <!-- 소매 좌 -->
  <rect x="5"  y="20" width="4"  height="6"  fill="#DB2777"/>
  <!-- 소매 끝단 좌 -->
  <rect x="5"  y="25" width="4"  height="1"  fill="#9D174D"/>
  <!-- 소매 우 -->
  <rect x="23" y="20" width="4"  height="6"  fill="#DB2777"/>
  <!-- 소매 끝단 우 -->
  <rect x="23" y="25" width="4"  height="1"  fill="#9D174D"/>

  <!-- 흉배 레벨 1 — 테두리만 -->
  <rect x="14" y="22" width="4"  height="3"  fill="#9D174D"/>
  <rect x="15" y="23" width="2"  height="1"  fill="#DB2777"/>

  <!-- 도구 좌 소매: 삽 (세로 막대 + 하단 삼각) -->
  <rect x="4"  y="20" width="1"  height="3"  fill="#F4ECD8"/>
  <rect x="3"  y="23" width="3"  height="1"  fill="#F4ECD8"/>
  <rect x="3"  y="24" width="3"  height="1"  fill="#1A1410"/>
  <!-- 도구 우 소매: 돌덩이 (불규칙 3x2px) -->
  <rect x="27" y="23" width="3"  height="2"  fill="#92400E"/>
  <rect x="27" y="24" width="1"  height="1"  fill="#1A1410"/>
  <rect x="29" y="23" width="1"  height="1"  fill="#1A1410"/>

  <!-- 발 / 신발 -->
  <rect x="10" y="29" width="4"  height="3"  fill="#1A1410"/>
  <rect x="18" y="29" width="4"  height="3"  fill="#1A1410"/>
</svg>
