<!--
  Character: 호조낭청 (planning-hojo)
  Version: 1.0 / Phase 2 F
  Author: devDogam pixel team
  License: MIT (devDogam project internal)
  Based on: planner-dojeon.svg template (32x32 rect-based pixel art)
  Palette: base #06B6D4, shadow #0E7490, skin #F0CFA0, outline #1A1410
  Hat: 복두 (문관계, 좌우 각 1px 축소)
  Expression: 집중형 (눈썹 강조, 입 일자)
  Insignia: 레벨 2 (흉배 내부 점)
  Tools: 두루마리(L) + 붓(R)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="64" height="64">
  <!-- 복두 기단 (문관계, 사모보다 낮고 납작) -->
  <rect x="10" y="4" width="12" height="2" fill="#1A1410"/>
  <!-- 복두 좌 각 (1px로 축소) -->
  <rect x="9"  y="3" width="1"  height="3" fill="#1A1410"/>
  <!-- 복두 우 각 (1px로 축소) -->
  <rect x="22" y="3" width="1"  height="3" fill="#1A1410"/>
  <!-- 복두 몸체 -->
  <rect x="10" y="6" width="12" height="2" fill="#1A1410"/>
  <!-- 복두 하단 테두리 -->
  <rect x="9"  y="8" width="14" height="1" fill="#1A1410"/>

  <!-- 얼굴 -->
  <rect x="10" y="9"  width="12" height="8" fill="#F0CFA0"/>
  <!-- 얼굴 좌 음영 -->
  <rect x="10" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 얼굴 우 음영 -->
  <rect x="21" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 눈썹 집중형 좌 -->
  <rect x="12" y="10" width="2"  height="1" fill="#1A1410"/>
  <!-- 눈썹 집중형 우 -->
  <rect x="18" y="10" width="2"  height="1" fill="#1A1410"/>
  <!-- 눈 집중형 좌 (2x2) -->
  <rect x="12" y="12" width="2"  height="2" fill="#1A1410"/>
  <!-- 눈 집중형 우 (2x2) -->
  <rect x="18" y="12" width="2"  height="2" fill="#1A1410"/>
  <!-- 입 집중형 (일자 4x1) -->
  <rect x="14" y="15" width="4"  height="1" fill="#1A1410"/>

  <!-- 목 -->
  <rect x="13" y="17" width="6"  height="2" fill="#F0CFA0"/>
  <!-- 흰 깃 -->
  <rect x="11" y="18" width="2"  height="1" fill="#F4ECD8"/>
  <rect x="19" y="18" width="2"  height="1" fill="#F4ECD8"/>

  <!-- 관복 몸통 (청록) -->
  <rect x="9"  y="19" width="14" height="10" fill="#06B6D4"/>
  <!-- 좌 어깨 음영 -->
  <rect x="9"  y="19" width="2"  height="10" fill="#0E7490"/>
  <!-- 우 어깨 음영 -->
  <rect x="21" y="19" width="2"  height="10" fill="#0E7490"/>
  <!-- 중앙 여밈선 -->
  <rect x="15" y="19" width="2"  height="10" fill="#0E7490"/>
  <!-- 소매 좌 -->
  <rect x="5"  y="20" width="4"  height="6"  fill="#06B6D4"/>
  <!-- 소매 끝단 좌 -->
  <rect x="5"  y="25" width="4"  height="1"  fill="#0E7490"/>
  <!-- 소매 우 -->
  <rect x="23" y="20" width="4"  height="6"  fill="#06B6D4"/>
  <!-- 소매 끝단 우 -->
  <rect x="23" y="25" width="4"  height="1"  fill="#0E7490"/>

  <!-- 흉배 레벨 2 — 테두리 + 내부 점 -->
  <rect x="13" y="21" width="6"  height="4"  fill="#0E7490"/>
  <rect x="15" y="22" width="2"  height="2"  fill="#F4ECD8"/>

  <!-- 도구 좌 소매: 두루마리 (가로 원통, 4px 폭) -->
  <rect x="3"  y="23" width="4"  height="1"  fill="#1A1410"/>
  <rect x="3"  y="24" width="4"  height="1"  fill="#F4ECD8"/>
  <rect x="3"  y="25" width="4"  height="1"  fill="#1A1410"/>
  <!-- 도구 우 소매: 붓 (세로 1x4 + 끝 1px 검정) -->
  <rect x="28" y="21" width="1"  height="3"  fill="#F4ECD8"/>
  <rect x="28" y="24" width="1"  height="2"  fill="#1A1410"/>

  <!-- 발 / 신발 -->
  <rect x="10" y="29" width="4"  height="3"  fill="#1A1410"/>
  <rect x="18" y="29" width="4"  height="3"  fill="#1A1410"/>
</svg>
