<!--
  Character: 척후 (security-chukhu)
  Version: 1.0 / Phase 2 F
  Author: devDogam pixel team
  License: MIT (devDogam project internal)
  Based on: planner-dojeon.svg template (32x32 rect-based pixel art)
  Palette: base #DC2626, shadow #991B1B, skin #F0CFA0, outline #1A1410
  Hat: 벙거지/전립 (군계, 낮고 둥근 형태)
  Expression: 긴장형 (눈 넓게 3x2, 입 4x1 일자)
  Insignia: 레벨 0 (흉배 없음, 여밈선만)
  Tools: 단도(L) + 망원경(R)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="64" height="64">
  <!-- 벙거지/전립 (낮고 둥근, 위 편평) -->
  <rect x="9"  y="4" width="14" height="1"  fill="#1A1410"/>
  <!-- 전립 상단 편평 -->
  <rect x="10" y="5" width="12" height="2"  fill="#1A1410"/>
  <!-- 전립 내부 -->
  <rect x="10" y="5" width="12" height="2"  fill="#2D1515"/>
  <!-- 전립 하단 -->
  <rect x="9"  y="7" width="14" height="1"  fill="#1A1410"/>

  <!-- 얼굴 -->
  <rect x="10" y="9"  width="12" height="8" fill="#F0CFA0"/>
  <!-- 얼굴 좌 음영 -->
  <rect x="10" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 얼굴 우 음영 -->
  <rect x="21" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 긴장형 눈 좌 (3x2 넓게) -->
  <rect x="11" y="11" width="3"  height="2" fill="#1A1410"/>
  <!-- 긴장형 눈 우 (3x2 넓게) -->
  <rect x="18" y="11" width="3"  height="2" fill="#1A1410"/>
  <!-- 긴장형 입 (2x1 좁게) -->
  <rect x="14" y="15" width="4"  height="1" fill="#1A1410"/>

  <!-- 목 -->
  <rect x="13" y="17" width="6"  height="2" fill="#F0CFA0"/>
  <!-- 흰 깃 -->
  <rect x="11" y="18" width="2"  height="1" fill="#F4ECD8"/>
  <rect x="19" y="18" width="2"  height="1" fill="#F4ECD8"/>

  <!-- 관복 몸통 (빨강) -->
  <rect x="9"  y="19" width="14" height="10" fill="#DC2626"/>
  <!-- 좌 어깨 음영 -->
  <rect x="9"  y="19" width="2"  height="10" fill="#991B1B"/>
  <!-- 우 어깨 음영 -->
  <rect x="21" y="19" width="2"  height="10" fill="#991B1B"/>
  <!-- 중앙 여밈선 (레벨0 — 여밈선만) -->
  <rect x="15" y="19" width="2"  height="10" fill="#991B1B"/>
  <!-- 소매 좌 -->
  <rect x="5"  y="20" width="4"  height="6"  fill="#DC2626"/>
  <!-- 소매 끝단 좌 -->
  <rect x="5"  y="25" width="4"  height="1"  fill="#991B1B"/>
  <!-- 소매 우 -->
  <rect x="23" y="20" width="4"  height="6"  fill="#DC2626"/>
  <!-- 소매 끝단 우 -->
  <rect x="23" y="25" width="4"  height="1"  fill="#991B1B"/>

  <!-- 흉배 레벨 0 — 없음 (여밈선만 위에서 처리됨) -->

  <!-- 도구 좌 소매: 단도 (세로 4px + 손잡이 2px 가로) -->
  <rect x="4"  y="21" width="1"  height="4"  fill="#C9A37A"/>
  <rect x="3"  y="25" width="3"  height="1"  fill="#1A1410"/>
  <!-- 도구 우 소매: 망원경 (2x3px 원통 3개 연결) -->
  <rect x="27" y="22" width="2"  height="1"  fill="#1A1410"/>
  <rect x="27" y="23" width="3"  height="1"  fill="#C9A37A"/>
  <rect x="28" y="24" width="2"  height="1"  fill="#1A1410"/>

  <!-- 발 / 신발 -->
  <rect x="10" y="29" width="4"  height="3"  fill="#1A1410"/>
  <rect x="18" y="29" width="4"  height="3"  fill="#1A1410"/>
</svg>
