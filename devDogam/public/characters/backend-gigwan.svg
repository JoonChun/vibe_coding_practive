<!--
  Character: 기관도제 (backend-gigwan)
  Version: 1.0 / Phase 2 F
  Author: devDogam pixel team
  License: MIT (devDogam project internal)
  Based on: planner-dojeon.svg template (32x32 rect-based pixel art)
  Palette: base #C2660A, shadow #92400E, skin #F0CFA0, outline #1A1410
  Hat: 공장건 (기술계, 챙 좁음 x=9~23)
  Expression: 집중형 (눈썹 강조, 입 일자)
  Insignia: 레벨 1 (흉배 테두리만)
  Tools: 망치(L) + 톱니(R)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges" width="64" height="64">
  <!-- 공장건 챙 (좁음) -->
  <rect x="9"  y="5" width="14" height="1"  fill="#1A1410"/>
  <!-- 공장건 몸통 -->
  <rect x="10" y="3" width="12" height="2"  fill="#1A1410"/>
  <!-- 공장건 내부 -->
  <rect x="10" y="3" width="12" height="3"  fill="#3D1F00"/>
  <!-- 공장건 하단 테두리 -->
  <rect x="9"  y="6" width="14" height="2"  fill="#1A1410"/>

  <!-- 얼굴 -->
  <rect x="10" y="9"  width="12" height="8" fill="#F0CFA0"/>
  <!-- 얼굴 좌 음영 -->
  <rect x="10" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 얼굴 우 음영 -->
  <rect x="21" y="9"  width="1"  height="8" fill="#C9A37A"/>
  <!-- 눈썹 집중형 좌 -->
  <rect x="12" y="10" width="2"  height="1" fill="#1A1410"/>
  <!-- 눈썹 집중형 우 -->
  <rect x="18" y="10" width="2"  height="1" fill="#1A1410"/>
  <!-- 눈 집중형 좌 (2x2) -->
  <rect x="12" y="12" width="2"  height="2" fill="#1A1410"/>
  <!-- 눈 집중형 우 (2x2) -->
  <rect x="18" y="12" width="2"  height="2" fill="#1A1410"/>
  <!-- 입 집중형 (일자 4x1) -->
  <rect x="14" y="15" width="4"  height="1" fill="#1A1410"/>

  <!-- 목 -->
  <rect x="13" y="17" width="6"  height="2" fill="#F0CFA0"/>
  <!-- 흰 깃 -->
  <rect x="11" y="18" width="2"  height="1" fill="#F4ECD8"/>
  <rect x="19" y="18" width="2"  height="1" fill="#F4ECD8"/>

  <!-- 관복 몸통 (갈색) -->
  <rect x="9"  y="19" width="14" height="10" fill="#C2660A"/>
  <!-- 좌 어깨 음영 -->
  <rect x="9"  y="19" width="2"  height="10" fill="#92400E"/>
  <!-- 우 어깨 음영 -->
  <rect x="21" y="19" width="2"  height="10" fill="#92400E"/>
  <!-- 중앙 여밈선 -->
  <rect x="15" y="19" width="2"  height="10" fill="#92400E"/>
  <!-- 소매 좌 -->
  <rect x="5"  y="20" width="4"  height="6"  fill="#C2660A"/>
  <!-- 소매 끝단 좌 -->
  <rect x="5"  y="25" width="4"  height="1"  fill="#92400E"/>
  <!-- 소매 우 -->
  <rect x="23" y="20" width="4"  height="6"  fill="#C2660A"/>
  <!-- 소매 끝단 우 -->
  <rect x="23" y="25" width="4"  height="1"  fill="#92400E"/>

  <!-- 흉배 레벨 1 — 테두리만 -->
  <rect x="14" y="22" width="4"  height="3"  fill="#92400E"/>
  <rect x="15" y="23" width="2"  height="1"  fill="#C2660A"/>

  <!-- 도구 좌 소매: 망치 (T자, 3x3px) -->
  <rect x="2"  y="22" width="3"  height="1"  fill="#1A1410"/>
  <rect x="3"  y="23" width="1"  height="2"  fill="#1A1410"/>
  <!-- 도구 우 소매: 톱니바퀴 (원형 3px + 톱니) -->
  <rect x="27" y="22" width="3"  height="3"  fill="#1A1410"/>
  <rect x="28" y="22" width="1"  height="3"  fill="#92400E"/>
  <rect x="27" y="23" width="3"  height="1"  fill="#92400E"/>

  <!-- 발 / 신발 -->
  <rect x="10" y="29" width="4"  height="3"  fill="#1A1410"/>
  <rect x="18" y="29" width="4"  height="3"  fill="#1A1410"/>
</svg>
