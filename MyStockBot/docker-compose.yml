services:
  mystockbot:
    build: .
    container_name: mystockbot
    ports:
      # localhost 에만 바인드 — 외부 공개는 터널(cloudflared/Tailscale)만이 유일한 경로다.
      # "8000:8000"(=0.0.0.0)으로 두면 터널이 죽은 순간 LAN/방화벽 설정에 따라 백엔드가
      # 직접 노출된다. 터널 프로세스는 이 호스트에서 돌므로 127.0.0.1 로 충분하다.
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      TZ: Asia/Seoul
      MYSTOCKBOT_DB_PATH: /app/data/mystockbot.db
    volumes:
      # SQLite DB + KIS 토큰 캐시. 호스트에서 직접 열어볼 수 있게 바인드 마운트로 둔다.
      - ./data:/app/data
    # ★ 컨테이너를 **호스트 사용자 권한으로** 돌린다.
    #
    #   이미지 기본값은 non-root(uid 10001)인데, 바인드 마운트한 ./data 는 호스트
    #   사용자(보통 uid 1000) 소유다. 그대로 두면 컨테이너가 DB 파일을 만들 수 없어
    #   "unable to open database file" 로 죽는다 — chown 을 요구하는 것보다 실행 uid 를
    #   맞추는 편이 낫다(여전히 non-root 다).
    #   uid 가 1000 이 아니면 `UID=$(id -u) GID=$(id -g) docker compose up -d` 로 넘긴다.
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    # 컨테이너 로그 상한 — 기본 json-file 드라이버는 무제한이라 상시 실행(수집 루프가
    # 30초마다 로그를 남긴다) 환경에서 디스크를 조용히 먹는다. 10MB × 3세대로 묶는다.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # slim 이미지에 curl 이 없어 파이썬 표준 라이브러리를 쓴다.
      # /api/health 는 인증 예외 경로 — API 토큰이 설정돼도 헬스체크는 계속 통과한다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
