name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MyStockBot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: pytest

  web:
    name: web (tsc + vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MyStockBot/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: MyStockBot/web/package-lock.json
      - run: npm ci
      # 단위 테스트를 빌드보다 먼저 — 로직이 깨졌으면 번들이 나와도 의미가 없다.
      - name: Test (vitest)
        run: npm test
      - run: npm run build
