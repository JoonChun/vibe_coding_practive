name: MyStockBot Stock Collector

on:
  schedule:
    - cron: '0 7 * * 1-5'  # KST 16:00 (UTC 07:00), 월~금
  workflow_dispatch:
    inputs:
      force_run:
        description: '주말에도 강제 실행 (테스트용)'
        type: boolean
        default: true

jobs:
  collect-stock-prices:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MyStockBot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Docker 이미지와 동일한 고정 버전(lock) 사용 — 느슨한 범위(requirements.txt)로
      # 설치하면 크론만 최신 의존성으로 굴러 어느 날 조용히 깨진다.
      - run: pip install -r requirements.lock.txt

      # KIS_ACCOUNT_NO 는 읽는 코드가 없어 제거했다(조회 전용 앱 — 계좌번호 불필요).
      # 사용하지 않는 민감정보를 제3자 인프라(GitHub Secrets)에 두면 유출 표면만 넓어진다.
      - run: python src/main.py
        env:
          FORCE_RUN: ${{ inputs.force_run && '1' || '' }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
